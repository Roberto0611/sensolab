<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Acto 4 — Cierre</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: Inter, "Segoe UI", system-ui, sans-serif;
          color: #ffffff;
          overflow: hidden;
        }

        #c-field {
          position: absolute;
          left: -12%;
          top: 0;
          width: 132%;
          height: 100%;
          background: #0b1416;
          clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
          z-index: 0;
        }

        #c-slab-a {
          position: absolute;
          left: -240px;
          top: -180px;
          width: 900px;
          height: 1440px;
          background: #ff5a1f;
          clip-path: polygon(0 0, 100% 0, 68% 100%, 0 100%);
          z-index: 0;
        }

        #c-slab-b {
          position: absolute;
          left: 1360px;
          top: -180px;
          width: 860px;
          height: 1440px;
          background: #00e0c8;
          clip-path: polygon(32% 0, 100% 0, 100% 100%, 0 100%);
          z-index: 0;
        }

        /* Fills the whole frame and centres its contents both ways, so the
           lockup stays centred no matter what is left inside it. */
        #c-wrap {
          position: absolute;
          inset: 0;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }

        #c-logo {
          width: 680px;
          height: auto;
          display: block;
        }

        #c-rule {
          margin-top: 34px;
          height: 6px;
          width: 460px;
          background: #ffffff;
          transform-origin: center center;
        }
      </style>

      <div data-hf-id="hf-n3qp" id="root" data-composition-id="cierre" data-width="1920" data-height="1080">
        <div data-hf-id="hf-3kys" id="c-field" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-fm32" id="c-slab-a" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-9gd9" id="c-slab-b" data-layout-allow-overflow="true"></div>

        <div data-hf-id="hf-3n15" id="c-wrap">
          <img data-hf-id="hf-aso2" id="c-logo" src="assets/logo-sensolab.png" alt="SensoLab Solutions">
          <div data-hf-id="hf-xj4f" id="c-rule"></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          gsap.set("#c-rule", { scaleX: 0 });

          // 0.00 — ink field wipes in, brand slabs slam from both edges.
          tl.fromTo(
            "#c-field",
            { xPercent: -120 },
            { xPercent: 0, duration: 0.4, ease: "expo.out" },
            0,
          );
          tl.fromTo(
            "#c-slab-a",
            { xPercent: -130 },
            { xPercent: 0, duration: 0.6, ease: "expo.out" },
            0.08,
          );
          tl.fromTo(
            "#c-slab-b",
            { xPercent: 130 },
            { xPercent: 0, duration: 0.6, ease: "expo.out" },
            0.08,
          );

          // 0.35 — the brand lands, dead centre.
          tl.fromTo(
            "#c-logo",
            { yPercent: 26, scale: 0.92, autoAlpha: 0 },
            { yPercent: 0, scale: 1, autoAlpha: 1, duration: 0.6, ease: "expo.out" },
            0.35,
          );
          tl.fromTo(
            "#c-rule",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "expo.out" },
            0.85,
          );

          // 1.4 — the slabs keep closing in on the lockup through to the last frame,
          // so the card breathes without the logo ever leaving centre.
          tl.fromTo("#c-slab-a", { x: 0 }, { x: 96, duration: 5.4, ease: "sine.inOut" }, 1.4);
          tl.fromTo("#c-slab-b", { x: 0 }, { x: -96, duration: 5.4, ease: "sine.inOut" }, 1.4);
          tl.fromTo("#c-logo", { scale: 1 }, { scale: 1.03, duration: 5.4, ease: "sine.inOut" }, 1.4);

          window.__timelines["cierre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
